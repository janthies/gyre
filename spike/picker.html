<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<style>
	:root {
		--bg: var(--vscode-editor-background);
		--fg: var(--vscode-editor-foreground);
		--muted: var(--vscode-descriptionForeground);
		--border: var(--vscode-editorWidget-border, var(--vscode-widget-border, #ebdbb2));
		--sel-bg: var(--vscode-list-activeSelectionBackground);
		--sel-fg: var(--vscode-list-activeSelectionForeground);
		--match: var(--vscode-list-highlightForeground, #af3a03);
		--lineno: var(--vscode-editorLineNumber-foreground);
		--mono: var(--vscode-editor-font-family, monospace);
		--size: var(--vscode-editor-font-size, 14px);
	}
	html, body { height: 100%; margin: 0; }
	body {
		display: flex; flex-direction: column; gap: 6px;
		padding: 10px; box-sizing: border-box;
		background: var(--bg); color: var(--fg);
		font-family: var(--mono); font-size: var(--size);
	}
	#picker { flex: 1; min-height: 0; display: flex; gap: 10px; }
	.box { border: 1px solid var(--border); border-radius: 8px; min-width: 0; display: flex; flex-direction: column; }
	#left { flex: 1; }
	#right { flex: 1; }
	#prompt { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
	#prompt .caret { color: var(--match); }
	#q { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--fg); font: inherit; }
	#count { color: var(--muted); white-space: nowrap; }
	#list { flex: 1; min-height: 0; overflow: hidden; margin: 0; padding: 4px 0; list-style: none; }
	#list li { padding: 0 10px; white-space: pre; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
	#list li.sel { background: var(--sel-bg); color: var(--sel-fg); border-radius: 4px; margin: 0 4px; padding: 0 6px; }
	#list b { color: var(--match); font-weight: bold; }
	#list li.sel b { color: inherit; text-decoration: underline; }
	#ptitle { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#ptext { flex: 1; min-height: 0; overflow: hidden; margin: 0; padding: 6px 10px; line-height: 1.45; white-space: pre; }
	#ptext .n { color: var(--lineno); display: inline-block; min-width: 3.5ch; margin-right: 1.5ch; text-align: right; user-select: none; }
	#status { color: var(--muted); font-size: 0.85em; display: flex; justify-content: space-between; gap: 12px; }
</style>
</head>
<body>
	<div id="picker">
		<div class="box" id="left">
			<div id="prompt"><span class="caret">&gt;</span><input id="q" spellcheck="false" autocomplete="off"><span id="count"></span></div>
			<ul id="list"></ul>
		</div>
		<div class="box" id="right">
			<div id="ptitle"></div>
			<pre id="ptext"></pre>
		</div>
	</div>
	<div id="status"><span id="timing">opening…</span><span>↑↓ / C-n C-p · PgUp PgDn · Enter open · C-v split · Esc close</span></div>
<script nonce="{{nonce}}">
	const vscode = acquireVsCodeApi();
	const q = document.getElementById('q');
	const list = document.getElementById('list');
	const count = document.getElementById('count');
	const ptitle = document.getElementById('ptitle');
	const ptext = document.getElementById('ptext');
	const timing = document.getElementById('timing');

	const MAX_ROWS = 300;
	let files = [];
	let matches = []; // { file, pos }
	let sel = 0;
	let info = {};
	const previews = new Map();
	let previewTimer;

	// Spike-quality fuzzy matcher: every space-separated term must appear as a subsequence;
	// consecutive characters, segment starts and matches in the file name score higher.
	function match(cand, terms) {
		const lc = cand.toLowerCase();
		const base = cand.lastIndexOf('/') + 1;
		let score = 0;
		const pos = [];
		for (const term of terms) {
			let from = 0, last = -2;
			for (const ch of term) {
				const j = lc.indexOf(ch, from);
				if (j < 0) {
					return null;
				}
				let s = 1;
				if (j === last + 1) s += 5;
				const prev = cand[j - 1];
				if (j === 0 || '/_-. '.includes(prev)) s += 4;
				if (j >= base) s += 2;
				score += s;
				pos.push(j);
				last = j;
				from = j + 1;
			}
		}
		return { file: cand, pos, score: score - cand.length * 0.05 };
	}

	function filter() {
		const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
		if (!terms.length) {
			matches = files.map(file => ({ file, pos: [] }));
		} else {
			matches = [];
			for (const f of files) {
				const m = match(f, terms);
				if (m) matches.push(m);
			}
			matches.sort((a, b) => b.score - a.score);
		}
		sel = 0;
		render();
	}

	function esc(s) {
		return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
	}

	function highlight(m) {
		if (!m.pos.length) return esc(m.file);
		const set = new Set(m.pos);
		let out = '';
		for (let i = 0; i < m.file.length; i++) {
			const c = esc(m.file[i]);
			out += set.has(i) ? `<b>${c}</b>` : c;
		}
		return out;
	}

	function visibleRows() {
		const li = list.querySelector('li');
		const h = li ? li.getBoundingClientRect().height : 20;
		return Math.max(1, Math.floor(list.clientHeight / h));
	}

	function render() {
		count.textContent = `${matches.length}/${files.length}`;
		const rows = visibleRows();
		const start = Math.max(0, Math.min(sel - Math.floor(rows / 2), matches.length - rows));
		const slice = matches.slice(start, start + Math.min(rows, MAX_ROWS));
		list.innerHTML = slice.map((m, i) => `<li class="${start + i === sel ? 'sel' : ''}">${highlight(m)}</li>`).join('');
		schedulePreview();
	}

	function schedulePreview() {
		clearTimeout(previewTimer);
		const m = matches[sel];
		if (!m) {
			ptitle.textContent = '';
			ptext.textContent = '';
			return;
		}
		ptitle.textContent = m.file;
		if (previews.has(m.file)) {
			showPreview(m.file, previews.get(m.file));
		} else {
			previewTimer = setTimeout(() => vscode.postMessage({ type: 'preview', file: m.file }), 30);
		}
	}

	function showPreview(file, text) {
		if (matches[sel]?.file !== file) return;
		if (text === null) {
			ptext.innerHTML = '<span class="n"></span>(binary or unreadable)';
			return;
		}
		const lines = text.split('\n').slice(0, 400);
		ptext.innerHTML = lines.map((l, i) => `<span class="n">${i + 1}</span>${esc(l)}`).join('\n');
	}

	function move(delta) {
		if (!matches.length) return;
		sel = Math.max(0, Math.min(matches.length - 1, sel + delta));
		render();
	}

	q.addEventListener('input', filter);
	// Keys stay inside the picker: without stopPropagation the webview forwards them to VS Code,
	// which would run its own bindings (Ctrl+P quick open, Ctrl+N new file, Esc, ...).
	q.addEventListener('keydown', e => {
		e.stopPropagation();
		const ctrl = e.ctrlKey && !e.altKey && !e.metaKey;
		const page = Math.max(1, visibleRows() - 1);
		if (e.key === 'ArrowDown' || (ctrl && e.key === 'n')) move(1);
		else if (e.key === 'ArrowUp' || (ctrl && e.key === 'p')) move(-1);
		else if (e.key === 'PageDown') move(page);
		else if (e.key === 'PageUp') move(-page);
		else if (e.key === 'Enter' && matches[sel]) vscode.postMessage({ type: 'open', file: matches[sel].file, split: false });
		else if (ctrl && e.key === 'v' && matches[sel]) vscode.postMessage({ type: 'open', file: matches[sel].file, split: true });
		else if (e.key === 'Escape' || (ctrl && e.key === 'c')) vscode.postMessage({ type: 'close' });
		else return;
		e.preventDefault();
	});

	window.addEventListener('message', ({ data }) => {
		if (data.type === 'timing') {
			info = { ...info, mode: data.mode, readyMs: data.readyMs };
		} else if (data.type === 'files') {
			files = data.files;
			info = { ...info, listMs: data.listMs };
			filter();
		} else if (data.type === 'preview') {
			previews.set(data.file, data.text);
			showPreview(data.file, data.text);
		}
		timing.textContent = `${info.mode ?? ''} · ready in ${info.readyMs ?? '…'} ms` +
			(info.listMs !== undefined ? ` · ${files.length} files listed in ${info.listMs} ms` : '');
	});
	window.addEventListener('focus', () => q.focus());
	window.addEventListener('resize', render);
	q.focus();
	vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
